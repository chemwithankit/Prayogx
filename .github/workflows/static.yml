# Deploy the PrayogX static site to GitHub Pages
#
# Only the website and the simulation assets it serves are deployed. Working
# files stay in the repository but are never published:
#   papers/           source exam PDFs - deliberately not public
#   tools/            maintenance scripts
#   templates/        the authoring shell for new simulations
#   data/tracker.csv  internal progress tracker
#
# content/ IS published: it is the feed the website, the PWA and the mobile apps
# read. It is generated from data/manifest.json, never edited by hand.
#   README.md, publish.sh
#
# The exclude list is deliberately a *deny* list, not an allow list, so a new
# simulation folder or a new site asset is published automatically with no
# change to this file.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate the library before building anything
        run: |
          python3 tools/sync_manifest.py
          python3 tools/build_content.py
          python3 tools/check_library.py
          if ! git diff --quiet -- data/ content/; then
            echo "::error::the committed manifest, feed or revision lock is stale."
            echo "Run ./publish.sh (or tools/sync_manifest.py + tools/build_content.py)"
            echo "and commit the result. Refusing to deploy content that does not match"
            echo "what is in the repository."
            git --no-pager diff --stat -- data/ content/
            exit 1
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_site' \
            --exclude='./papers' \
            --exclude='./tools' \
            --exclude='./templates' \
            --exclude='./data/tracker.csv' \
            --exclude='./publish.sh' \
            --exclude='./README.md' \
            --exclude='./.gitignore' \
            --exclude='.DS_Store' \
            . | tar -xf - -C _site

      - name: Fail if anything private slipped into the deploy
        run: |
          if [ -e _site/papers ]; then
            echo "::error::papers/ must never be deployed"
            exit 1
          fi
          if find _site -iname '*.pdf' | grep -q .; then
            echo "::error::a PDF reached the deploy directory:"
            find _site -iname '*.pdf'
            exit 1
          fi
          echo "Deploying:"
          find _site -maxdepth 2 -mindepth 1 | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
