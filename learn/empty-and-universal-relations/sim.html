<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sim-id" content="LEARN-C12-MAT-RELATIONS-SIM">
<title>Relation grid · PrayogX Learn simulation</title>
<style>
:root{--bg:#f4f4f1;--card:#fcfcfb;--line:#d9d9d4;--ink:#0b0b0b;--mut:#52514e;--acc:#2a78d6;--b:#6f4fd6;--good:#00743f;--neg:#c62828;--empty:#ececea;--pos:#d9542b}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--card:#1a1a19;--line:#34342f;--ink:#fff;--mut:#c3c2b7;--acc:#3987e5;--b:#a48bff;--good:#3fae7a;--neg:#ef5350;--empty:#2a2a28;--pos:#f0824f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:17px;margin:2px 0 8px}
h2{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:6px 10px;cursor:pointer;min-height:40px}
button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:650}
.small{font-size:13px;color:var(--mut)}
.verdict{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:2.6em}
svg{display:block;width:100%;height:auto}
.g{display:grid;grid-template-columns:34px repeat(4,1fr);gap:4px;max-width:420px;margin:10px auto 0}
.h{text-align:center;font-weight:700;line-height:34px;color:var(--mut)}
.c{min-height:56px;padding:0;font-weight:700}
.c.on{background:var(--b);border-color:var(--b);color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>Relation grid: A = {1, 2, 3, 4}</h1>
<div class="card">
<h2>Choose a rule, or tap the pairs yourself</h2>
<div class="row" id="rules"></div>
<div class="g" id="g"></div>
<div class="verdict" id="v" aria-live="polite"></div>
<p class="small" style="margin:8px 0 0">Row = a, column = b. A lit cell means the ordered pair (a, b) is in R. A × A has 16 pairs.</p>
</div>
</div>
<script>
(function () {
  "use strict";
  var A = [1, 2, 3, 4];
  var RULES = [
    { id: "sum10", label: "a + b = 10", t: function (a, b) { return a + b === 10; } },
    { id: "eq", label: "a = b", t: function (a, b) { return a === b; } },
    { id: "lt", label: "a < b", t: function (a, b) { return a < b; } },
    { id: "even", label: "a + b is even", t: function (a, b) { return (a + b) % 2 === 0; } },
    { id: "diff", label: "|a − b| < 5", t: function (a, b) { return Math.abs(a - b) < 5; } }
  ];
  var S = { rule: "sum10", on: [] };
  function $(id) { return document.getElementById(id); }
  function apply(id) {
    var r, i, k; S.rule = id; S.on = [];
    for (i = 0; i < RULES.length; i++) { if (RULES[i].id === id) { r = RULES[i]; } }
    for (k = 0; k < 16; k++) { S.on[k] = r ? r.t(A[Math.floor(k / 4)], A[k % 4]) : false; }
    render();
  }
  function count() { var n = 0, k; for (k = 0; k < 16; k++) { if (S.on[k]) { n++; } } return n; }
  function type() { var n = count(); return n === 0 ? "empty" : n === 16 ? "universal" : "between"; }
  function render() {
    var k, i, n = count(), t = type();
    for (k = 0; k < 16; k++) { $("c" + k).className = "c" + (S.on[k] ? " on" : ""); $("c" + k).setAttribute("aria-pressed", S.on[k] ? "true" : "false"); }
    for (i = 0; i < RULES.length; i++) { $("r-" + RULES[i].id).setAttribute("aria-pressed", S.rule === RULES[i].id ? "true" : "false"); }
    $("v").innerHTML = t === "empty" ? "<b>Empty relation.</b> No pair passes: R = empty set." : t === "universal" ? "<b>Universal relation.</b> All 16 pairs pass: R = A × A." : "<b>" + n + " of 16 pairs.</b> R is a subset of A × A, between the two trivial relations.";
  }
  (function build() {
    var g = $("g"), i, j, d, b;
    g.appendChild(document.createElement("div"));
    for (j = 0; j < 4; j++) { d = document.createElement("div"); d.className = "h"; d.textContent = "b=" + A[j]; g.appendChild(d); }
    for (i = 0; i < 4; i++) {
      d = document.createElement("div"); d.className = "h"; d.textContent = String(A[i]); g.appendChild(d);
      for (j = 0; j < 4; j++) {
        b = document.createElement("button"); b.type = "button"; b.id = "c" + (i * 4 + j); b.textContent = "(" + A[i] + "," + A[j] + ")";
        b.setAttribute("data-k", String(i * 4 + j));
        b.onclick = function () { PX.toggle(parseInt(this.getAttribute("data-k"), 10)); };
        g.appendChild(b);
      }
    }
    for (i = 0; i < RULES.length; i++) {
      b = document.createElement("button"); b.type = "button"; b.id = "r-" + RULES[i].id; b.textContent = RULES[i].label;
      b.setAttribute("data-r", RULES[i].id);
      b.onclick = function () { PX.setRule(this.getAttribute("data-r")); };
      $("rules").appendChild(b);
    }
  }());
  window.PX = {
    setRule: apply,
    toggle: function (k) { S.on[k] = !S.on[k]; S.rule = "own"; render(); },
    reset: function () { apply("sum10"); },
    state: function () { var p = [], k; for (k = 0; k < 16; k++) { if (S.on[k]) { p.push([A[Math.floor(k / 4)], A[k % 4]]); } } return { rule: S.rule, pairs: p, count: p.length, type: type() }; }
  };
  apply("sum10");
}());
</script>
</body>
</html>
