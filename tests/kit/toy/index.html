<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PX-KIT toy harness | PrayogX (test only)</title>
<meta name="sim-id" content="PX-KIT-TOY">
<style>
:root{--bg:#0b1020;--panel:#121a2e;--text:#e8eefc;--dim:#a9b8d6;--good:#22c55e;--line:#2a3654}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:18px;margin:6px 0}
.note{font-size:13px;color:var(--dim);margin:0 0 10px}
section{margin:0 0 14px}
canvas#labcv{display:block;width:100%;height:auto;border-radius:12px;background:#05070d;touch-action:pan-y}
#guide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;min-height:3em}
#hint{color:#fbbf24;margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{min-height:48px;font:700 16px ui-sans-serif,system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:#1b2540;color:var(--text);padding:0 14px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
#nextbtn{background:var(--good);color:#04210f;border:none;font-weight:900}
.stickybtn{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:20;width:min(520px,calc(100% - 32px));min-height:56px;border:none;border-radius:14px;background:var(--good);color:#04210f;font-weight:900}
</style>
</head>
<body>
<main class="wrap">
<section id="question"><h1>PX-KIT toy harness: heat from a heater</h1>
<p class="note">A test-only page for the PrayogX Experience Kit (Phase 1). It is not part of the library, the catalogue or the site. A heater warms water; q = m c ΔT.</p></section>
<section id="lab">
<canvas id="labcv" width="720" height="440" role="img" aria-label="A cup of water, a heater and a thermometer, drawn in 2.5D for the kit tests."></canvas>
<p id="guide" data-sci aria-live="polite"></p>
<p id="hint" hidden></p>
<div class="row">
  <button type="button" id="nextbtn">…</button>
  <button type="button" id="w100" data-act="fill" data-arg="100">100 g</button>
  <button type="button" id="w200" data-act="fill" data-arg="200">200 g</button>
  <button type="button" id="heatbtn" data-act="heat">Heater on</button>
  <button type="button" id="revealbtn" data-act="reveal">Work out q</button>
  <button type="button" id="resetbtn">Reset</button>
</div>
</section>
<button type="button" id="stickybtn" class="stickybtn" hidden></button>
</main>
<script>
(function () {
"use strict";
/* ENGINE-BEGIN */
var ENGINE = (function () {
  /* A heater warms water in an insulated cup. Water c = 4.2 J g-1 °C-1 (NCERT Class 11 Chemistry Part I, Unit 5,
     Problem 5.8). The heater's power and switch-on time are illustrative. run(params, t) is pure. */
  var C = 4.2, T0 = 25.0, P = 150, TON = 7;
  function run(p, t) {
    var on = p.tOn === null ? 0 : Math.max(0, Math.min(t - p.tOn, TON)), q = P * on, dT = q / (p.m * C);
    return { m: p.m, c: C, P: P, q: q, dT: dT, T: T0 + dT, qFinal: P * TON, heating: p.tOn !== null && t - p.tOn < TON ? 1 : 0 };
  }
  return { C: C, T0: T0, P: P, TON: TON, run: run };
})();
/* ENGINE-END */

/* PX-KIT clock@1 BEGIN */
/* px-clock@1 - deterministic simulation time.
   Time advances only through step(dt). In a page, drive() takes dt from the requestAnimationFrame timestamp,
   which the PrayogX recorder replaces with its manual clock, so recordings are frame-exact.
   No wall-clock reads, no randomness. */
var CLOCK = (function () {
  function create(opts) {
    opts = opts || {};
    var c = { t: 0, frame: 0, speed: 1, paused: false, substep: opts.substep || 0, maxDt: opts.maxDt || 0.05 }, subs = [], acc = 0, ticks = 0;
    /* advance by dt seconds (scaled by speed, capped by maxDt). With substep > 0, time moves in whole fixed
       substeps and the remainder carries to the next frame, so 30 fps and 60 fps give the same steps. */
    c.step = function (dt) {
      dt = +dt;
      if (!(dt > 0)) dt = 0;
      if (dt > c.maxDt) dt = c.maxDt;
      c.frame++;
      if (c.paused || dt === 0) return 0;
      var h = dt * c.speed, n, k, i;
      if (!(c.substep > 0)) { c.t += h; for (i = 0; i < subs.length; i++) subs[i](h, c.t); return h; }
      acc += h; n = Math.floor(acc / c.substep + 1e-9); acc = Math.max(0, acc - n * c.substep);
      for (k = 0; k < n; k++) {
        c.t = ++ticks * c.substep;
        for (i = 0; i < subs.length; i++) subs[i](c.substep, c.t);
      }
      return n * c.substep;
    };
    /* fn(h, t) runs on every (sub)step: animations, model integration, camera transitions */
    c.on = function (fn) { subs.push(fn); return c; };
    c.pause = function (on) { c.paused = on === undefined ? !c.paused : !!on; return c.paused; };
    c.setSpeed = function (k) { k = +k; if (k > 0 && isFinite(k)) c.speed = k; return c.speed; };
    c.reset = function () { c.t = 0; c.frame = 0; c.paused = false; acc = 0; ticks = 0; };
    return c;
  }
  /* frame-rate-independent smoothing: deterministic for a fixed dt */
  function approach(cur, target, rate, dt) { return cur + (target - cur) * (1 - Math.exp(-rate * dt)); }
  /* the page loop: before() (e.g. action replay), then step, then onFrame(dt) (director, observables, drawing) */
  function drive(c, onFrame, before) {
    var last = null;
    function f(ts) {
      var dt = last === null ? 0 : (ts - last) / 1000;
      last = ts;
      if (before) before();
      c.step(dt);
      onFrame(dt);
      requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  }
  return { create: create, approach: approach, drive: drive };
})();
/* PX-KIT clock@1 END */
/* PX-KIT obs@1 BEGIN */
/* px-obs@1 - the one scientific truth.
   An observable is a named, typed, provenance-tagged scientific quantity. frame(ctx) computes every value once,
   in definition order; every consumer (renderer, guide, PX.state, tests, recorder) reads that one snapshot.
   Scientific values never contain presentation progress: present()/fp() give a gradual reveal of a value
   without changing the observable. f()/num()/fp() record what they printed, and shown() records every
   visible string with its kind, so tests can prove each scientific number came from an observable. */
var OBS = (function () {
  var STATUS = ["measured", "calculated", "illustrative", "idealized", "hypothetical", "exaggerated"];
  var KINDS = ["sci", "ui", "decor"];
  var ID = /^[a-z][A-Za-z0-9]*(\.[A-Za-z][A-Za-z0-9]*)*$/;
  function create() {
    var defs = {}, order = [], vals = null, emitted = [], shown = [], mark = 0, o = { frames: 0 };
    function fail(m) { throw new Error("OBS: " + m); }
    function need(id) {
      if (!defs[id]) fail("unknown observable " + id);
      if (!vals) fail("no frame computed yet");
    }
    o.def = function (id, d) {
      d = d || {};
      if (!ID.test(id)) fail("bad id " + id);
      if (defs[id]) fail("duplicate observable " + id);
      if (typeof d.unit !== "string") fail(id + ": unit must be a string ('' if none)");
      if (!d.meaning) fail(id + ": meaning is required");
      if (STATUS.indexOf(d.status) < 0) fail(id + ": status must be one of " + STATUS.join(", "));
      if (typeof d.from !== "function") fail(id + ": from(ctx, get) is required");
      if (d.signed && !d.sign) fail(id + ": a signed observable needs its sign convention");
      var dec = d.decimals === undefined ? 2 : d.decimals;
      if (!(dec >= 0 && dec <= 6 && Math.floor(dec) === dec)) fail(id + ": decimals must be 0-6");
      defs[id] = { id: id, unit: d.unit, meaning: d.meaning, status: d.status, signed: !!d.signed, sign: d.sign || null,
        decimals: dec, plus: !!d.plus, from: d.from };
      order.push(id);
      return o;
    };
    /* compute the snapshot for this frame; values may use earlier observables through get(id) */
    o.frame = function (ctx) {
      var out = {}, i, id, v;
      var get = function (k) { if (!(k in out)) fail(k + " used before it is defined"); return out[k]; };
      for (i = 0; i < order.length; i++) {
        id = order[i];
        v = defs[id].from(ctx, get);
        if (typeof v !== "number" || !isFinite(v)) fail(id + " is not a finite number");
        out[id] = v;
      }
      vals = out; emitted = []; shown = []; mark = 0; o.frames++;
      return o;
    };
    o.v = function (id) { need(id); return vals[id]; };
    function fmt(d, x) {
      var p = Math.pow(10, d.decimals), s = (Math.round(x * p) / p).toFixed(d.decimals);
      if (Number(s) === 0) s = (0).toFixed(d.decimals);
      if (s.charAt(0) === "-") s = "−" + s.slice(1);
      else if (d.plus && Number(s) > 0) s = "+" + s;
      return s;
    }
    function unit(d, s) { return d.unit ? s + " " + d.unit : s; }
    o.num = function (id) { need(id); var s = fmt(defs[id], vals[id]); emitted.push(s); return s; };
    o.f = function (id) { need(id); var s = unit(defs[id], fmt(defs[id], vals[id])); emitted.push(s); return s; };
    /* presentation transform: a gradual reveal from start toward the observable; never stored, never an observable */
    o.present = function (id, progress, start) {
      need(id);
      var p = progress < 0 ? 0 : progress > 1 ? 1 : +progress || 0, s0 = start === undefined ? 0 : +start;
      return s0 + (vals[id] - s0) * p;
    };
    o.fp = function (id, progress, start) { var s = unit(defs[id], fmt(defs[id], o.present(id, progress, start))); emitted.push(s); return s; };
    o.meta = function (id) {
      if (!defs[id]) fail("unknown observable " + id);
      var d = defs[id];
      return { id: d.id, unit: d.unit, meaning: d.meaning, status: d.status, signed: d.signed, sign: d.sign, decimals: d.decimals };
    };
    o.ids = function () { return order.slice(); };
    o.snapshot = function () { var s = {}, i; if (!vals) return s; for (i = 0; i < order.length; i++) s[order[i]] = vals[order[i]]; return s; };
    /* flat fields for PX.state(): the recorder keeps only flat number/string/boolean fields */
    o.flat = function () { var s = {}, i; if (!vals) return s; for (i = 0; i < order.length; i++) s["obs_" + order[i].replace(/\./g, "_")] = vals[order[i]]; return s; };
    /* every visible string goes through shown(). Each entry keeps the f()/num()/fp() strings printed since the
       previous shown() call (from), so a test can check that every number in a "sci" text is one of its own
       observable strings, not a number that only happens to be printed elsewhere in the frame. */
    o.shown = function (text, kind) {
      kind = kind || "sci";
      if (KINDS.indexOf(kind) < 0) fail("bad text kind " + kind);
      shown.push({ text: String(text), kind: kind, from: emitted.slice(mark) });
      mark = emitted.length;
      return String(text);
    };
    o.shownList = function () { return shown.slice(); };
    o.emitted = function () { return emitted.slice(); };
    return o;
  }
  return { create: create, STATUS: STATUS, KINDS: KINDS };
})();
/* PX-KIT obs@1 END */
/* PX-KIT act@1 BEGIN */
/* px-act@1 - one input path and the learning script.
   Learner taps, the Director, tests and the recorder all call do(id, args, source). An action may validate,
   change learning state, start an animation, change scene or request a camera shot; it never computes a
   scientific quantity and never draws. The learning script is data: scenes, allowed actions, next-action
   rules, exit conditions, guide ids and milestones. Conditions are objects, never evaluated strings.
   State shape it relies on: S.scene (index into script.scenes) and S.flags (plain object). */
var ACT = (function () {
  var SOURCES = ["learner", "director", "test", "recorder"];
  var COND_KEYS = ["all", "any", "not", "flag", "obs", "op", "value", "tol", "pred", "idle"];
  var OPS = [">=", "<=", ">", "<", "==", "!="];
  function create(o) {
    var S = o.state, script = o.script, defs = {}, preds = {}, log = [], hits = [], api = {};
    function fail(m) { throw new Error("ACT: " + m); }
    function scene() { return script.scenes[S.scene]; }
    function busy() { return !!(o.busy && o.busy()); }
    api.def = function (id, d) {
      if (defs[id]) fail("duplicate action " + id);
      if (!d || typeof d.run !== "function") fail(id + ": run(S, args) is required");
      defs[id] = { when: d.when || function () { return true; }, run: d.run, args: d.args || null, whileBusy: !!d.whileBusy };
      return api;
    };
    /* named predicates: the only code a condition may call */
    api.pred = function (name, fn) { if (preds[name]) fail("duplicate predicate " + name); preds[name] = fn; return api; };
    api.cond = function (c) {
      var i;
      if (!c) return true;
      if (c.all) { for (i = 0; i < c.all.length; i++) if (!api.cond(c.all[i])) return false; return true; }
      if (c.any) { for (i = 0; i < c.any.length; i++) if (api.cond(c.any[i])) return true; return false; }
      if (c.not) return !api.cond(c.not);
      if (c.flag !== undefined) return c.flag.charAt(0) === "!" ? !S.flags[c.flag.slice(1)] : !!S.flags[c.flag];
      if (c.obs !== undefined) {
        var v = o.obs.v(c.obs), x = c.value, tol = c.tol || 0;
        if (c.op === ">=") return v >= x - tol;
        if (c.op === "<=") return v <= x + tol;
        if (c.op === ">") return v > x;
        if (c.op === "<") return v < x;
        if (c.op === "==") return Math.abs(v - x) <= tol;
        if (c.op === "!=") return Math.abs(v - x) > tol;
        fail("bad comparator " + c.op);
      }
      if (c.pred !== undefined) { if (!preds[c.pred]) fail("unknown predicate " + c.pred); return !!preds[c.pred](S); }
      if (c.idle !== undefined) return busy() !== !!c.idle;
      fail("unknown condition " + JSON.stringify(c));
    };
    function allowed(id) {
      if (id === "advance") return true;
      var a = scene().allow || [];
      return a.indexOf(id) >= 0 || a.indexOf("*") >= 0;
    }
    /* the built-in action that moves to the next scene, once the current scene's exit condition holds */
    api.def("advance", {
      when: function () { return S.scene < script.scenes.length - 1 && api.cond(scene().exit); },
      run: function () { S.scene++; if (o.onScene) o.onScene(S.scene); }
    });
    api.check = function (id, args) {
      var d = defs[id];
      if (!d) return "unknown action " + id;
      if (busy() && !d.whileBusy) return "busy";
      if (!allowed(id)) return id + " is not allowed in scene " + scene().id;
      if (d.args && d.args.indexOf(args) < 0) return "bad argument " + args + " for " + id;
      if (!d.when(S, args)) return id + " is not ready";
      return null;
    };
    api.do = function (id, args, source) {
      if (SOURCES.indexOf(source) < 0) return { ok: false, reason: "bad source " + source };
      var why = api.check(id, args);
      if (why) return { ok: false, reason: why };
      defs[id].run(S, args);
      var e = { f: o.clock.frame, t: +o.clock.t.toFixed(6), id: id, args: args === undefined ? null : args, source: source };
      log.push(e);
      if (o.onAction) o.onAction(e);
      return { ok: true };
    };
    /* the one thing to do next: the first matching rule of the current scene that can run now */
    api.next = function () {
      if (busy()) return null;
      var rules = scene().next || [], i, r;
      for (i = 0; i < rules.length; i++) {
        r = rules[i];
        if (api.cond(r["if"]) && !api.check(r.act, r.args)) return { id: r.act, args: r.args === undefined ? null : r.args, label: r.label || r.act };
      }
      return null;
    };
    api.doNext = function (source) { var n = api.next(); return n ? api.do(n.id, n.args === null ? undefined : n.args, source || "learner") : { ok: false, reason: "nothing to do" }; };
    /* tap regions, registered by the presentation each frame */
    api.hitsReset = function () { hits = []; };
    api.hit = function (r, id, args) { hits.push({ x: r.x, y: r.y, w: r.w, h: r.h, id: id, args: args }); };
    api.at = function (x, y) { var i, h; for (i = hits.length - 1; i >= 0; i--) { h = hits[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; } return null; };
    api.log = function () { return log.slice(); };
    api.reset = function () { log = []; hits = []; };
    /* replay: re-apply logged inputs at the same simulation time, so a session replays the same at any frame
       rate (Director actions are regenerated by the Director) */
    api.replayer = function (entries) {
      var list = [], i = 0, k;
      for (k = 0; k < entries.length; k++) if (entries[k].source !== "director") list.push(entries[k]);
      return function () {
        while (i < list.length && list[i].t <= o.clock.t + 1e-6) { var e = list[i++]; api.do(e.id, e.args === null ? undefined : e.args, e.source); }
      };
    };
    api.scene = scene;
    /* static checks of the script against the defined actions, predicates and guide ids */
    api.validate = function (guideIds) {
      var out = [], seen = {}, i, j;
      function cond(c, where) {
        if (!c) return;
        var k;
        for (k in c) if (c.hasOwnProperty(k) && COND_KEYS.indexOf(k) < 0) out.push(where + ": unknown condition key " + k);
        if (typeof c === "string" || typeof c === "function") out.push(where + ": conditions must be objects");
        if (c.all) for (k = 0; k < c.all.length; k++) cond(c.all[k], where);
        if (c.any) for (k = 0; k < c.any.length; k++) cond(c.any[k], where);
        if (c.not) cond(c.not, where);
        if (c.obs !== undefined && OPS.indexOf(c.op) < 0) out.push(where + ": bad comparator " + c.op);
        if (c.pred !== undefined && !preds[c.pred]) out.push(where + ": unknown predicate " + c.pred);
      }
      if (!script || !script.scenes || !script.scenes.length) return ["the script has no scenes"];
      for (i = 0; i < script.scenes.length; i++) {
        var sc = script.scenes[i], w = "scene " + (sc.id || i);
        if (!sc.id) out.push(w + ": id is required");
        if (seen[sc.id]) out.push(w + ": duplicate scene id");
        seen[sc.id] = 1;
        if (!sc.objective) out.push(w + ": objective is required");
        for (j = 0; j < (sc.allow || []).length; j++) if (sc.allow[j] !== "*" && !defs[sc.allow[j]]) out.push(w + ": allows unknown action " + sc.allow[j]);
        for (j = 0; j < (sc.next || []).length; j++) {
          if (!defs[sc.next[j].act]) out.push(w + ": next names unknown action " + sc.next[j].act);
          cond(sc.next[j]["if"], w + " next");
        }
        cond(sc.exit, w + " exit");
        if (guideIds && sc.guide && guideIds.indexOf(sc.guide) < 0) out.push(w + ": unknown guide " + sc.guide);
        if (i < script.scenes.length - 1 && !sc.exit) out.push(w + ": a scene that is not the last needs an exit condition");
      }
      return out;
    };
    /* UI convention (proven in CON-CHE-CALORIMETER-01): the guide's NEXT button does the next action, and a
       sticky button offers it whenever the experiment is on screen but neither the NEXT button nor the
       page's own action buttons are. Pass DOM elements; isOnScreen(el) decides visibility. */
    api.syncNextUI = function (u) {
      var n = api.next(), inView = function (el) { if (!el || el.hidden || el.offsetParent === null) return false; var r = el.getBoundingClientRect(); return r.top >= 0 && r.bottom <= window.innerHeight; };
      if (u.button){ u.button.disabled = !n; u.button.textContent = n ? "▶ " + n.label : (u.idleText || "…"); }
      if (u.sticky) {
        var cv = u.stage ? u.stage.getBoundingClientRect() : null, stageOn = !cv || (cv.bottom > 80 && cv.top < window.innerHeight - 80);
        var others = false, i; for (i = 0; i < (u.primary || []).length; i++) if (inView(u.primary[i])) others = true;
        var show = !!n && stageOn && !inView(u.button) && !others;
        if (u.sticky.hidden === show) u.sticky.hidden = !show;
        if (show) u.sticky.textContent = "▶ " + n.label;
      }
      return n;
    };
    return api;
  }
  return { create: create, SOURCES: SOURCES };
})();
/* PX-KIT act@1 END */
/* PX-KIT dir@1 BEGIN */
/* px-dir@1 - the event-aware Director.
   A film is a list of steps. It acts only through act.do(id, args, "director"), so it obeys the same
   validation as a learner; it waits on animation idleness, observable comparisons, named predicates,
   learner actions or simulation seconds; it never evaluates strings and never touches scientific state.
   update() runs once per frame after the clock step, so the same inputs give the same film every time.
   Status lives in S.dir (serialisable): film, i, mode, mark, marks, shot, focus, say, hint, error, done. */
var DIR = (function () {
  var KINDS = ["do", "wait", "shot", "focus", "say", "mark", "end"];
  var WAITS = ["idle", "obs", "pred", "learner", "seconds"];
  var MODES = ["media", "classroom", "learner"];
  function create(o) {
    var S = o.state, act = o.act, clock = o.clock, films = {}, api = {}, playing = false, steps = null, w = null;
    function fail(m) { throw new Error("DIR: " + m); }
    function blank() { return { film: null, i: 0, mode: null, mark: null, marks: 0, shot: null, focus: null, say: null, hint: null, error: null, done: false }; }
    S.dir = blank();
    function check(s, n) {
      var kinds = [], k;
      for (k in s) if (s.hasOwnProperty(k) && KINDS.indexOf(k) >= 0) kinds.push(k);
      if (kinds.length !== 1) fail(n + ": a step needs exactly one of " + KINDS.join(", "));
      if (s["do"] !== undefined && typeof s["do"] !== "string") fail(n + ": do names an action");
      if (s.wait) {
        var ws = [];
        for (k in s.wait) if (s.wait.hasOwnProperty(k) && WAITS.indexOf(k) >= 0) ws.push(k);
        if (ws.length !== 1) fail(n + ": a wait needs exactly one of " + WAITS.join(", "));
        if (s.wait.obs !== undefined && (typeof s.wait.obs !== "string" || typeof s.wait.op !== "string" || typeof s.wait.value !== "number")) fail(n + ": wait obs needs {obs, op, value}");
        if (s.wait.pred !== undefined && typeof s.wait.pred !== "string") fail(n + ": wait pred names a predicate");
        if (s.wait.learner !== undefined && typeof s.wait.learner !== "string") fail(n + ": wait learner names an action");
        if (s.wait.seconds !== undefined && !(s.wait.seconds >= 0)) fail(n + ": wait seconds must be a number");
        if (s.wait.timeout !== undefined && !(s.wait.timeout > 0)) fail(n + ": timeout must be positive");
      }

      focus: S.dir.focus, say: S.dir.say, hint: S.dir.hint, dirError: S.dir.error, done: RUN.done, obs: O.snapshot() }, f = O.flat(), k;
    for (k in f) out[k] = f[k];
    return out;
  },
  obs: function (id) { return O.v(id); },
  anchors: function () { return JSON.parse(JSON.stringify(anchors)); },
  next: function () { return A.next(); },
  doNext: function () { return A.doNext("learner"); },
  snapshot: snapshot,
  texts: function () { return O.shownList(); },
  emitted: function () { return O.emitted(); },
  log: function () { return A.log(); },
  replay: function (entries) { reset(); replayFn = A.replayer(entries); }
};

reset();
CLOCK.drive(clock, frame, function () { if (replayFn) replayFn(); });
})();
</script>
