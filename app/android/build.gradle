// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.10.0 is the floor that can compile against API 36; anything
        // below 8.9.1 refuses. It requires Gradle 8.11.1 (see the wrapper) and
        // JDK 17. This is the root pin - Gradle's buildscript classloaders
        // delegate parent-first, so this version is the one every subproject
        // actually applies, including the Capacitor modules under node_modules
        // that still declare 8.2.1 in their own buildscript blocks.
        classpath 'com.android.tools.build:gradle:8.10.0'
        classpath 'com.google.gms:google-services:4.4.0'
        // Kotlin enters the project only through @capacitor-community/admob,
        // which pins 1.9.10 in its own buildscript - too old for AGP 8.10.0.
        // This is the root pin that actually applies, for the same
        // parent-first reason as the AGP line above. It cannot read
        // $kotlin_version from variables.gradle: Gradle evaluates buildscript
        // blocks before the rest of the file, so the number is written out
        // here and must be kept in step with kotlin_version there.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
