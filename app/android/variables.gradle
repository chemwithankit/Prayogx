ext {
    minSdkVersion = 22
    // Google Play requires new apps and updates to target API 36 (Android 16)
    // as of 31 August 2026. Anything lower is rejected at upload, so this is a
    // floor, not a preference. compileSdk must match: you cannot target an API
    // you have not compiled against.
    //
    // API 36 needs a newer toolchain than Capacitor 6 ships with - see
    // docs/DEPLOYMENT.md, "Android 16 toolchain", for the exact upgrade.
    // Do not lower these back to clear a build error; upgrade the toolchain.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'

    // --- AdMob: @capacitor-community/admob 6.2.0 --------------------------
    // The plugin reads these from here; naming them makes the versions
    // explicit instead of inheriting whatever its own defaults happen to be.
    //
    // play-services-ads 23.0.0 raised the Google Mobile Ads floor to API 21,
    // so minSdkVersion 22 above is unaffected. Do NOT move to 24.x: that
    // requires minSdk 23 and would drop every Android 5.1 device.
    playServicesAdsVersion = '23.0.0'
    androidxCoreKTXVersion = '1.13.0'
    //
    // This plugin is the only Kotlin in the project and declares 1.9.10 in
    // its own buildscript, which predates AGP 8.10.0. Buildscript
    // classloaders delegate parent-first, so the root build.gradle classpath
    // decides - keep that line and this one at the same version.
    kotlin_version = '2.2.0'
}