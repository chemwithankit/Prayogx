<header class="site-head">
  <div class="inner">
    <a class="brand" href="#/" aria-label="PrayogX home">
      <svg class="pxmark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M12.5 6.5h7M13.6 6.5v7.2L7.9 24.1a1.5 1.5 0 0 0 1.3 2.3h13.6a1.5 1.5 0 0 0 1.3-2.3l-5.7-10.4V6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 20.6h10.8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>

    </a>
    <button class="themebtn" id="themebtn" type="button" aria-label="Switch colour theme">◐ theme</button>
  </div>
</header>

<main id="app">
  <div class="inner">
    <p class="loading" id="boot">Loading the simulation library…</p>
  </div>
</main>

<!-- The simulation runner. A simulation is a self-contained file and stays one:
     it is framed, never rewritten, so the header below is the same header on the
     website, in the PWA, in the Android app and in any iOS app later, and adding
     a simulation needs no navigation code of its own. -->
<div class="runner" id="runner" hidden>
  <div class="rbar">
    <a class="rback" id="rback" href="#/">&lsaquo; Library</a>
    <span class="rtitle" id="rtitle"></span>
    <button class="rfav" id="rfav" type="button" aria-pressed="false" aria-label="Save"></button>
  </div>
  <div class="rstage" id="rstage"></div>
  <button class="rtop" id="rtop" type="button" hidden aria-label="Back to the top of the simulation">&uarr; Top</button>
</div>

<footer class="site-foot">
  <div class="inner">
    <span><strong>PrayogX</strong> · JEE Advanced Interactive Simulation Library</span>
    <span class="dot">·</span>
    <span id="foot-src">catalogue generated from <code>data/manifest.json</code></span>
  </div>
</footer>

<!-- data/manifest.js is the file:// fallback and is now loaded on demand by
     site.js, not here: it carries the full catalogue (~10 KB per simulation)
     and a visitor served over http never needs a byte of it. -->
<script src="site/site.js?v=2fea7639"></script>
<script>
/* Register the service worker, and tell the visitor when a new version of the
   site is ready rather than swapping it under them mid-session. */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      reg.addEventListener("updatefound", function () {
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function () {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            var bar = document.createElement("div");
            bar.className = "updatebar";
            bar.innerHTML = "<span>A new version of the library is ready.</span>" +
              "<button type=\"button\">Reload</button>";
            bar.querySelector("button").addEventListener("click", function () {
              sw.postMessage("skip-waiting");
              location.reload();
            });
            document.body.appendChild(bar);
          }
        });
      });
    }).catch(function () { /* the site works without it */ });
  });
}
</script>
</body>
</html>
