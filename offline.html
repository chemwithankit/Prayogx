<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · PrayogX</title>
<link rel="icon" href="site/icons/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="site/site.css">
<style>
  .offwrap{max-width:560px;margin:14vh auto;padding:0 20px;text-align:center}
  .offwrap h1{font-size:23px;margin:0 0 10px}
  .offwrap p{color:var(--text-secondary);line-height:1.6;margin:0 0 16px}
  .offwrap a{display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div class="offwrap">
  <h1>You are offline</h1>
  <p>This simulation has not been opened on this device yet, so there is no copy stored here.</p>
  <p>Simulations you have already opened stay available offline. Reconnect to open a new one.</p>
  <a class="btn" href="./">Back to the library</a>
</div>
</body>
</html>
